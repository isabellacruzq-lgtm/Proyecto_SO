services:
  db:
    image: postgres:16
    container_name: so-db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U so -d so"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: isabellacruz/so-backend:1.0
    container_name: so-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos-postgres:
